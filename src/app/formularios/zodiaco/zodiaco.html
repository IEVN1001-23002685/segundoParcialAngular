<section class="flex items-center justify-center w-full px-30">
    <div class="w-1/2">
        <form class="max-w-5xl" [formGroup]="formulario">
            <fieldset class="flex flex-col py-8 text-center">
                <legend class="block text-2xl font-medium text-heading">Datos Personales</legend>
                <div class="flex items-center justify-center gap-2 mb-5">
                    <label for="email" class="block w-40 text-sm font-medium text-heading">Nombre</label>
                    <input type="email" id="email" formControlName="nombre"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Nombre" required />
                </div>
                <div class="flex items-center justify-center gap-2 mb-5">
                    <label for="apellidoPaterno" class="block w-40 text-sm font-medium text-heading">
                        Apellido Paterno
                    </label>
                    <input type="text" id="apellidoPaterno" formControlName="apellidoPaterno"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Apellido Paterno" required />
                </div>
                <div class="flex items-center justify-center gap-2 mb-5">
                    <label for="apellidoMaterno" class="block w-40 text-sm font-medium text-heading">
                        Apellido Materno
                    </label>
                    <input type="text" id="apellidoMaterno" formControlName="apellidoMaterno"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Apellido Materno" required />
                </div>
            </fieldset>
            <fieldset class="flex gap-12 py-8 text-center">
                <legend class="block text-2xl font-medium text-heading">Fecha de nacimiento</legend>
                <div class="mb-5">
                    <label for="dia" class="block mb-2.5 text-sm font-medium text-heading w-40">Dia</label>
                    <input type="number" id="dia" max="31" min="1" formControlName="dias"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-60 px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Ingres el dia" required>
                </div>
                <div class="mb-5">
                    <label for="mes" class="block mb-2.5 text-sm font-medium text-heading w-40">Mes</label>
                    <input type="number" id="mes" max="12" min="01" formControlName="mes"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-60 px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Ingres el mes" required>
                </div>
                <div class="mb-5">
                    <label for="ano" class="block mb-2.5 text-sm font-medium text-heading w-40">Año</label>
                    <input type="number" id="ano" max="2026" min="1" formControlName="ano"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-60 px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Ingres el año" required>
                </div>
            </fieldset>
            <fieldset class="flex flex-col py-8 text-center">
                <legend class="block text-2xl font-medium text-heading">Sexo</legend>
                <div class="flex items-center mb-4">
                    <input checked id="checkbox-1" type="radio" name="sexo"
                        class="w-4 h-4 border border-default-medium rounded-xs bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft">
                    <label for="checkbox-1" class="text-sm font-medium select-none ms-2 text-heading">
                        Masculino
                    </label>
                </div>
                <div class="flex items-center mb-4">
                    <input id="checkbox-2" type="radio" name="sexo"
                        class="w-4 h-4 border border-default-medium rounded-xs bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft">
                    <label for="checkbox-2" class="text-sm font-medium select-none ms-2 text-heading">
                        Femenino
                    </label>
                </div>
            </fieldset>
            <button type="submit" (click)="calcularMostrarDatos()"
                class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
                Imprimir
            </button>
        </form>
    </div>
    <div class="flex flex-col items-center justify-center w-1/2 gap-4 text-center">
        <h2>Hola
            <strong>{{ datosPersonales.nombre }} </strong>
            <strong>{{ datosPersonales.apellidoPaterno }} </strong>
            <strong>{{ datosPersonales.apellidoMaterno }}</strong>
        </h2>
        <h2>
            Tienes <strong>{{ datosPersonales.edad }} </strong> años
        </h2>
        <h2>
            Tu signo zodiacal
        </h2>
        <div class="flex">
            <h2>
                Es {{ datosPersonales.zigno }}
                <img [src]="datosPersonales.zignoImagen" {{datosPersonales.zigno}}width="150"
                    height="150">
            </h2>
        </div>
    </div>
</section>
